name: Temporary Pint diagnostic

on:
  push:
    branches:
      - feature/customer-management-drawer

permissions:
  contents: read

jobs:
  pint-diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
      - run: composer install --prefer-dist --no-interaction --no-progress
      - name: Apply Pint formatter in disposable runner and print exact diff
        run: |
          vendor/bin/pint tests/Feature/Customers/CustomerManagementTest.php
          git --no-pager diff -- tests/Feature/Customers/CustomerManagementTest.php
