name: Laravel CI

on:
  workflow_dispatch:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

permissions:
  contents: read

concurrency:
  group: laravel-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Tests, formatting and frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: kisan_khata_test
          MYSQL_USER: kisan_user
          MYSQL_PASSWORD: kisan_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: bcmath, ctype, curl, dom, fileinfo, gd, intl, mbstring, openssl, pcntl, pdo, pdo_mysql, pdo_sqlite, sqlite3, tokenizer, xml, zip
          coverage: none
          tools: composer:v2

      - name: Prepare environment
        run: |
          cp .env.example .env

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Generate application key
        run: php artisan key:generate --force

      - name: Validate Composer configuration
        run: composer validate --strict

      - name: Check PHP formatting
        run: |
          vendor/bin/pint
          git diff -- app/Modules/Financial tests/Feature/Financial

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Run MySQL row-lock integration test
        run: php artisan test --group=mysql-locking
        env:
          APP_ENV: testing
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: kisan_khata_test
          DB_USERNAME: kisan_user
          DB_PASSWORD: kisan_password
          SESSION_DRIVER: database

      - name: Run remaining Laravel test suite
        run: composer test -- --exclude-group=mysql-locking
        env:
          APP_ENV: testing
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: kisan_khata_test
          DB_USERNAME: kisan_user
          DB_PASSWORD: kisan_password
          SESSION_DRIVER: database
