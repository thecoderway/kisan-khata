<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kisan Khata - Login</title>
<link rel="stylesheet" href="../../../node_modules/@tabler/core/dist/css/tabler.min.css">
<link rel="stylesheet" href="../../../node_modules/@tabler/icons-webfont/dist/tabler-icons.min.css">
<link rel="stylesheet" href="./prototype.css">
</head>
<body>
<div class="min-vh-100 d-flex align-items-center justify-content-center p-3">
<div class="row w-100 justify-content-center">
<div class="col-12 col-sm-9 col-md-6 col-lg-4">
<div class="text-center mb-4">
<div class="kk-brand fs-1">🌱 Kisan Khata</div>
<div class="kk-muted mt-2">किसान के कारोबार का भरोसेमंद हिसाब</div>
</div>
<div class="kk-card shadow-sm">
<div class="kk-card-body p-4">
<h2 class="text-center mb-1">अपने खाते में लॉगिन करें</h2>
<p class="text-center kk-muted mb-4">आगे बढ़ने के लिए अपनी जानकारी भरें</p>
<form>
<div class="kk-field"><label class="form-label kk-form-label">मोबाइल नंबर</label><input class="form-control" type="tel" placeholder="10 अंकों का मोबाइल नंबर"></div>
<div class="kk-field"><label class="form-label kk-form-label">पासवर्ड</label><input class="form-control" type="password" placeholder="अपना पासवर्ड दर्ज करें"></div>
<div class="d-flex justify-content-between align-items-center mb-4">
<label class="form-check"><input class="form-check-input" type="checkbox"><span class="form-check-label">मुझे याद रखें</span></label>
<a href="#" class="text-success">पासवर्ड भूल गए?</a>
</div>
<button class="btn kk-btn-primary w-100" type="button">लॉगिन करें</button>
</form>
<div class="text-center mt-4 kk-muted">नया खाता बनाना चाहते हैं? <a href="#" class="text-success fw-bold">रजिस्टर करें</a></div>
</div>
</div>
<p class="text-center kk-muted small mt-3">यह केवल UI prototype है। Login अभी सक्रिय नहीं है।</p>
</div></div></div>
</body></html>
