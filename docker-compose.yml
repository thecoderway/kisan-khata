
name: kisan-khata

services:

  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: kisan_khata_app
    working_dir: /var/www/html
    group_add:
      - "2000"
    volumes:
      - ./:/var/www/html
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:?DB_DATABASE is required}
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - kisan_network

  frontend:
    image: node:22-alpine
    container_name: kisan_khata_frontend
    working_dir: /var/www/html
    init: true
    command: >
      sh -lc "if [ ! -x node_modules/.bin/vite ]; then npm ci; fi &&
      npm run dev -- --host 0.0.0.0"
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./:/var/www/html
      - frontend_node_modules:/var/www/html/node_modules
    networks:
      - kisan_network

  nginx:
    image: nginx:alpine
    container_name: kisan_khata_nginx
    ports:
      - "127.0.0.1:8081:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - kisan_network

  db:
    image: mysql:8.4
    container_name: kisan_khata_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:?DB_DATABASE is required}
      MYSQL_USER: ${DB_USERNAME:?DB_USERNAME is required}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required}
    ports:
      - "127.0.0.1:3308:3306"
    volumes:
      - kisan_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - kisan_network

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: kisan_khata_phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    ports:
      - "127.0.0.1:8082:80"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - kisan_network

networks:
  kisan_network:
    driver: bridge

volumes:
  kisan_mysql_data:
  frontend_node_modules:
