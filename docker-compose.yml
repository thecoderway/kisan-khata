
name: kisan-khata

services:

  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: kisan_khata_app
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: kisan_khata
      DB_USERNAME: kisan_user
      DB_PASSWORD: kisan_local_password
    depends_on:
      db:
        condition: service_healthy
    networks:
      - kisan_network

  nginx:
    image: nginx:alpine
    container_name: kisan_khata_nginx
    ports:
      - "127.0.0.1:8081:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - kisan_network

  db:
    image: mysql:8.4
    container_name: kisan_khata_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: kisan_khata
      MYSQL_USER: kisan_user
      MYSQL_PASSWORD: kisan_local_password
      MYSQL_ROOT_PASSWORD: kisan_root_local_password
    ports:
      - "127.0.0.1:3308:3306"
    volumes:
      - kisan_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - kisan_network

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: kisan_khata_phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    ports:
      - "127.0.0.1:8082:80"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - kisan_network

networks:
  kisan_network:
    driver: bridge

volumes:
  kisan_mysql_data:
